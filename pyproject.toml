[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptojacking-forensics"
version = "0.1.0a2"
description = "Offline, evidence-aware cryptojacking indicator-triage CLI with an in-process YARA engine, privacy-aware findings, and reproducible run metadata."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Dimple Nemade" }]
maintainers = [{ name = "Dimple Nemade" }]
keywords = ["forensics", "cryptojacking", "triage", "yara", "dfir", "incident-response"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = [
    "jsonschema>=4,<5",
    "yara-python>=4.3,<5",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "coverage[toml]>=7,<9",
    "mypy>=1.11,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
    "types-jsonschema>=4,<5",
]
test = ["pytest>=8,<9", "pytest-cov>=6,<8"]

[project.urls]
Homepage = "https://github.com/DimpleNemade/Cryptojacking_Project"
Repository = "https://github.com/DimpleNemade/Cryptojacking_Project"
Documentation = "https://github.com/DimpleNemade/Cryptojacking_Project/blob/main/docs"
Issues = "https://github.com/DimpleNemade/Cryptojacking_Project/issues"

[project.scripts]
cj-triage = "cryptojacking_forensics.cli:main"

[tool.setuptools.packages.find]
include = ["cryptojacking_forensics*"]

[tool.setuptools.package-data]
cryptojacking_forensics = ["py.typed", "rules/*.yar", "rules/*.json", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["cryptojacking_forensics"]
omit = ["tests/*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yara"]
ignore_missing_imports = true
