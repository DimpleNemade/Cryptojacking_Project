name: Bug report
description: Report a defect in the cj-triage tool
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Before you start
        Do **NOT** attach malware, miner binaries, credentials, personal data, live
        evidence, confidential reports, or unredacted paths/logs. Describe behavior with
        inert synthetic fixtures or redacted output only.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the defect.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Commands run, environment, and observed vs expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tool version
      description: Output of `cj-triage --version`
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I did not upload malware, miner binaries, credentials, personal data, or live evidence.
          required: true
