name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build cyclonedx-bom
      - name: Build wheel and source distribution
        run: python -m build
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Build runtime environment and SBOM
        run: |
          python -m venv sbom-env
          sbom-env/bin/pip install dist/*.whl
          cyclonedx-py environment sbom-env/bin/python --output-format JSON --output-file sbom.cdx.json --output-reproducible --validate --pyproject pyproject.toml --mc-type application
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"
      - name: Create GitHub prerelease
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --prerelease --generate-notes dist/* sbom.cdx.json
