name: Dependency Review and SBOM

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit runtime dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements-audit.txt --strict

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build runtime environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install build cyclonedx-bom
          python -m build --wheel
          python -m venv sbom-env
          sbom-env/bin/pip install dist/*.whl
      - name: Generate runtime SBOM (CycloneDX)
        run: >-
          cyclonedx-py environment sbom-env/bin/python
          --output-format JSON
          --output-file sbom.cdx.json
          --output-reproducible
          --validate
          --pyproject pyproject.toml
          --mc-type application
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error
