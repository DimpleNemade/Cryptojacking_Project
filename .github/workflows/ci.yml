name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff if available)
        run: |
          pip install ruff || true
          ruff check cryptojacking_forensics tests || true
        continue-on-error: true
      - name: Unit + integration tests
        run: python -m pytest -ra
      - name: Rule compilation check
        run: python -m cryptojacking_forensics rules check
      - name: Doctor
        run: python -m cryptojacking_forensics doctor
      - name: Build wheel
        run: python -m build --wheel
      - name: Install wheel in clean env and smoke test
        run: |
          python -m venv cleanenv
          if [ "$RUNNER_OS" = "Windows" ]; then cleanenv/Scripts/pip install dist/*.whl; cleanenv/Scripts/cj-triage --version; cleanenv/Scripts/cj-triage scan artifact tests/fixtures/synthetic_miner_indicators.txt --case-id CI --output ciout; else cleanenv/bin/pip install dist/*.whl; cleanenv/bin/cj-triage --version; cleanenv/bin/cj-triage scan artifact tests/fixtures/synthetic_miner_indicators.txt --case-id CI --output ciout; fi
        shell: bash
      - name: Coverage
        run: python -m pytest --cov=cryptojacking_forensics --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
