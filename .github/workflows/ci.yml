name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check cryptojacking_forensics tests tasks.py
      - name: Unit + integration tests
        run: python -m pytest -ra
      - name: Rule compilation check
        run: python -m cryptojacking_forensics rules check
      - name: Doctor
        run: python -m cryptojacking_forensics doctor
      - name: Build wheel
        run: python -m build --wheel
      - name: Install wheel in clean env and smoke test
        run: |
          python -m venv cleanenv
          if [ "$RUNNER_OS" = "Windows" ]; then CLI=cleanenv/Scripts/cj-triage; PIP=cleanenv/Scripts/pip; else CLI=cleanenv/bin/cj-triage; PIP=cleanenv/bin/pip; fi
          "$PIP" install dist/*.whl
          "$CLI" --version
          set +e
          "$CLI" scan artifact tests/fixtures/synthetic_miner_indicators.txt --case-id CI --output ciout
          rc=$?
          set -e
          test "$rc" -eq 10
        shell: bash
      - name: Coverage gate
        run: python -m pytest --cov=cryptojacking_forensics --cov-report=xml --cov-fail-under=85
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
